# =============================================================================
# CI — oxiflow
# =============================================================================
# Fast checks on every push, heavy suites on pull requests (#171):
#
#   push, any branch          fmt → clippy → unit tests + doctests
#   PR → staging/**, main     the same, then the full test suite per feature
#   push to main              the same as any push, then the doc deployment
#
# Jobs are ordered with `needs:` inside this one workflow: quality gates run
# before tests, and tests are skipped when a gate fails. The toolchain and the
# cache come from the shared `setup-rust` action (#184).
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["staging/**", "main"]

permissions:
  contents: read

# A newer push on the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Format — rustfmt, no cache needed
  # ──────────────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  # ──────────────────────────────────────────────────────────────────────────
  # Clippy — zero warnings, one matrix entry per feature
  # ──────────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          # faer sparse backend — DD-013 (#13), DD-043 (#50).
          - name: sparse
            args: --features sparse
          # hdf5-metno needs libhdf5's C headers via pkg-config — DD-027 (#75), #79.
          - name: hdf5
            args: --features hdf5
            hdf5: true
          # wgpu needs a driver at run time only, not to build — DD-026 (#73), DD-045 (#127).
          - name: gpu
            args: --features gpu
          # Rayon dispatch behind the threshold — DD-014 (#14), DD-048.
          - name: parallel
            args: --features parallel --all-targets
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          hdf5: ${{ matrix.hdf5 || false }}
          cache-key: clippy-${{ matrix.name }}
      - name: cargo clippy ${{ matrix.args }}
        run: cargo clippy --locked ${{ matrix.args }} -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────
  # Test — unit tests and doctests, default features, every push.
  # `--doc` cannot be combined with another target selector: two steps.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Unit and doc tests
    runs-on: ubuntu-latest
    needs: clippy
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - name: cargo test --lib
        run: cargo test --locked --lib
      - name: cargo test --doc
        run: cargo test --locked --doc

  # ──────────────────────────────────────────────────────────────────────────
  # Full test suite — pull requests only: unit, integration (tests/) and
  # doctests, once per feature. `gpu_context_acquires_adapter` stays
  # #[ignore]d: CI runners have no GPU.
  # ──────────────────────────────────────────────────────────────────────────
  test-full:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: sparse
            args: --features sparse
          - name: hdf5
            args: --features hdf5
            hdf5: true
          - name: gpu
            args: --features gpu
          - name: parallel
            args: --features parallel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          hdf5: ${{ matrix.hdf5 || false }}
          cache-key: test-${{ matrix.name }}
      - name: cargo test ${{ matrix.args }}
        run: cargo test --locked ${{ matrix.args }}

  # ──────────────────────────────────────────────────────────────────────────
  # Doc — build and deploy to GitHub Pages, push to main only.
  # Moves to a separate pages.yml later in this pass (#184), so that this
  # workflow keeps read-only permissions.
  # ──────────────────────────────────────────────────────────────────────────
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          hdf5: true
          cache-key: doc
      - name: cargo doc — build with KaTeX header
        run: RUSTDOCFLAGS="--html-in-header docs/katex-header.html" cargo doc --locked --no-deps --all-features
      - name: Add root redirect to oxiflow/index.html
        run: |
          echo '<meta http-equiv="refresh" content="0; url=oxiflow/index.html">' \
            > target/doc/index.html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          enable_jekyll: false
