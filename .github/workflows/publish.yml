# =============================================================================
# Publish — oxiflow to crates.io, on a release tag
# =============================================================================
# Triggered by a vX.Y.Z tag only: release candidates (X.Y.Z-rc.N) are never
# tagged in this form and never published (DQ-016, #168).
#
#   verify    tag = Cargo.toml version, tagged commit on main, quality gates
#             and tests (all features), cargo-semver-checks, packaging dry run
#   publish   behind the `crates-io` environment (required reviewer), with
#             crates.io Trusted Publishing: a short-lived token is exchanged
#             for the job's OIDC identity, no registry token is stored
#
# The GitHub release is published by hand from the Release Drafter draft.
# =============================================================================

name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # origin/main is needed for the ancestry check

      - name: Tag matches the Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/check-version.sh tag "$TAG"

      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: tag a commit merged into main."
            exit 1
          fi

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          hdf5: true
          cache-key: publish

      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy --all-features --all-targets
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: cargo test --all-features
        run: cargo test --locked --all-features

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks
        run: cargo semver-checks --all-features

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: verify
    environment: crates-io
    permissions:
      contents: read
      id-token: write   # OIDC identity for crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Exchange the OIDC identity for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
