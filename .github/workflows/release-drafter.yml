name: Release Drafter (SemVer)

# -----------------------------------------------------------------------------
# oxiflow uses the vX.Y.Z SemVer versioning scheme.
#
# Behaviour:
#   push to main / PR event  →  update the rolling release draft
#
# The draft is never published from here: crates.io publication runs in
# publish.yml on a vX.Y.Z tag, then the GitHub release is published by hand
# from this draft (#168). Automating that step is left for later.
#
# Configuration: .github/release-drafter-semver.yml
# -----------------------------------------------------------------------------

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter-semver.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
