# =============================================================================
# Coverage — cargo-llvm-cov, uploaded to Codecov with one flag per run
# =============================================================================
# Not run on sprint or feature branches: coverage follows what reaches main.
#
#   PR → staging/**, main   measured and compared with the base commit
#   push to main            measured again, as the reference later PRs are
#                           compared against
#
# One matrix entry per flag declared in .codecov.yml; Codecov waits for all
# of them (`after_n_builds`) before reporting. `gpu` is not measured: CI
# runners have no GPU, its code paths cannot run (#184).
#
# Measured: unit tests (`--lib`) and integration tests (`--tests`). Benchmarks
# and examples are left out: `--all-targets` ran the Criterion benches in test
# mode, unoptimised and instrumented, the most expensive part of the run, for
# code that tests/ is there to cover. Lines reached only by a bench or an
# example are no longer counted, so the rate may come out slightly lower than
# before this change.
# =============================================================================

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: ["staging/**", "main"]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage (${{ matrix.flag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flag: default
            args: --lib --tests
          # faer sparse backend — DT-013 (#13), DA-043 (#103), #50.
          - flag: sparse
            args: --lib --tests --features sparse
          # ExternalTabulated reads HDF5 files — DT-027 (#75), #79.
          - flag: hdf5
            args: --lib --tests --features hdf5
            hdf5: true
          # Rayon dispatch branches — DT-014 (#14), DA-048 (#140).
          - flag: parallel
            args: --lib --tests --features parallel
          # SimulationResult::write_vtk — DT-027 (#75), #78.
          - flag: vtk
            args: --lib --tests --features vtk
          # Serialisation and SimulationSnapshot — DT-025 (#66), #71.
          - flag: serde
            args: --lib --tests --features serde
          # INV-1/2/3 guards, meshes implemented outside the crate (#172).
          - flag: fem
            args: --test fem_invariants
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, for Codecov's commit tracking
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          hdf5: ${{ matrix.hdf5 || false }}
          cache-key: coverage-${{ matrix.flag }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov ${{ matrix.args }}
        run: cargo llvm-cov --locked ${{ matrix.args }} --lcov --output-path lcov-${{ matrix.flag }}.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov-${{ matrix.flag }}.info
          flags: ${{ matrix.flag }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
