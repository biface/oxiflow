# =============================================================================
# Audit — RustSec advisories against the committed Cargo.lock
# =============================================================================
# On every push and pull request, plus once a week: an advisory published
# between two commits still surfaces, even when nothing changes in the
# repository (#184). Renovate's lockfile updates are complementary, not a
# substitute. No toolchain is needed: cargo-audit reads Cargo.lock only.
# =============================================================================

name: Audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["staging/**", "main"]
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Ignored advisories, each pending a tracked fix. All three come from
      # vtkio 0.6.3 (optional `vtk` feature), which pins these versions: no
      # lockfile update can fix them. oxiflow only writes .vtu files, while
      # the flaws sit in read paths (LZ4 decompression, XML parsing). Fix
      # tracked in #191; remove these flags with it. Any other advisory
      # still fails the check.
      #   RUSTSEC-2026-0041  lz4_flex 0.7.5   uninitialised memory on invalid input
      #   RUSTSEC-2026-0194  quick-xml 0.22.0 quadratic duplicate-attribute check
      #   RUSTSEC-2026-0195  quick-xml 0.22.0 unbounded NsReader allocation
      - name: cargo audit
        run: >-
          cargo-audit audit
          --ignore RUSTSEC-2026-0041
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
