# Codecov configuration for oxiflow
# Generic PDE engine — transport, reaction, diffusion
# Documentation: https://docs.codecov.com/docs/codecov-yaml

# ──────────────────────────────────────────────────────────────────────────────
# Global settings
# ──────────────────────────────────────────────────────────────────────────────
codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes
    # One upload per flag (coverage.yml matrix): report only once all seven
    # have arrived, so a partial upload never shows as a coverage drop.
    after_n_builds: 7

# ──────────────────────────────────────────────────────────────────────────────
# Coverage targets
# Non-negotiable constraints: 80–90% global (DEVELOPPEMENT.md)
# ──────────────────────────────────────────────────────────────────────────────
coverage:
  precision: 2      # e.g. 85.42%
  round: down       # conservative rounding
  range: 80...90  # green >90%, yellow 80–90%, red <80%

  status:
    project:
      default:
        target: 85%   # global project target
        threshold: 2% # regression tolerance between commits
    patch:
      default:
        target: 80%   # every new line of code must be covered at 80%
        threshold: 5%

# ──────────────────────────────────────────────────────────────────────────────
# Flags — one upload per run of the coverage.yml matrix, same names.
# A new feature needs both a matrix entry there and a flag here, and
# after_n_builds (above and under `comment`) must match the number of runs.
# `gpu` has no flag: CI runners have no GPU (#184).
# ──────────────────────────────────────────────────────────────────────────────
flags:
  default:
    paths:
      - src/
    carryforward: false

  sparse:
    paths:
      - src/
    carryforward: false

  hdf5:
    paths:
      - src/
    carryforward: false

  parallel:
    paths:
      - src/
    carryforward: false

  vtk:
    paths:
      - src/
    carryforward: false

  serde:
    paths:
      - src/
    carryforward: false

  # tests/fem_invariants.rs alone (#172)
  fem:
    paths:
      - src/
    carryforward: false

# ──────────────────────────────────────────────────────────────────────────────
# Components — per-module coverage visibility
#
# Convention:
#   - One component per existing module under src/
#   - Target 90% for architectural contracts (traits, invariants)
#   - Target 85% for implementations (default rules)
# ──────────────────────────────────────────────────────────────────────────────
component_management:

  default_rules:
    statuses:
      - type: project
        target: 85%
      - type: patch
        target: 80%

  individual_components:

    # Context layer: ContextVariable, OxiflowError, ContextValue, ComputeContext
    # Architectural contract — highest coverage target
    - component_id: context
      name: "Context & Calculators"
      paths:
        - src/context/
      statuses:
        - type: project
          target: 90%

    # Model traits: RequiresContext
    # Architectural contract — high target
    - component_id: model
      name: "Model Traits"
      paths:
        - src/model/
      statuses:
        - type: project
          target: 90%

    # Mesh abstraction: Mesh trait + UniformGrid1D (INV-1)
    # Architectural contract — high target
    - component_id: mesh
      name: "Mesh Abstraction (INV-1)"
      paths:
        - src/mesh/
      statuses:
        - type: project
          target: 90%

    # Solver orchestration: Scenario, SolverConfiguration, Solver trait
    - component_id: solver
      name: "Solver Orchestration"
      paths:
        - src/solver/

    # Boundary conditions: BoundaryCondition trait and implementations
    - component_id: boundary
      name: "Boundary Conditions"
      paths:
        - src/boundary/

    # Multi-domain coupling: CouplingOperator (INV-3)
    - component_id: coupling
      name: "Multi-Domain Coupling (INV-3)"
      paths:
        - src/coupling/

    # Discrete operators: DiscreteOperator and schemes (INV-2)
    - component_id: operators
      name: "Discrete Operators (INV-2)"
      paths:
        - src/operators/

    # Modules under the FEM invariants, audited in #172 (INV-1/2/3).
    # Overlaps the mesh/operators/coupling components on purpose: one view
    # of the whole invariant surface.
    - component_id: fem_invariants
      name: "FEM Invariants (INV-1/2/3)"
      paths:
        - src/mesh/
        - src/operators/
        - src/coupling/
      statuses:
        - type: project
          target: 90%

# ──────────────────────────────────────────────────────────────────────────────
# Pull request comments
# ──────────────────────────────────────────────────────────────────────────────
comment:
  layout: reach,diff,flags,components,files
  behavior: default
  require_changes: true
  after_n_builds: 7

# ──────────────────────────────────────────────────────────────────────────────
# Ignored paths — no coverage measurement for tests, examples, benchmarks
# ──────────────────────────────────────────────────────────────────────────────
ignore:
  - tests/
  - examples/
  - benches/
  - "**/*_test.rs"

# ──────────────────────────────────────────────────────────────────────────────
# GitHub annotations on PRs
# ──────────────────────────────────────────────────────────────────────────────
github_checks:
  annotations: true
